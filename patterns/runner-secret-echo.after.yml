# The token reaches the process through the environment and never through the
# command line, and the job cannot overlap itself or run forever.
name: Synthetic journeys
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency:
  group: synthetic-journeys
  cancel-in-progress: false
jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      # Commit references in these examples are illustrative.
      - uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3
      - name: Run the journeys
        env:
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
        run: node bin/site-monitoring.mjs journeys > journey-output.json
      - name: Keep the output
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: journey-output
          path: journey-output.json
