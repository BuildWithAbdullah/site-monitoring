# The token is in the log, masking is best effort, and nothing stops two runs
# of this from happening at once.
name: Synthetic journeys
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  journeys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the journeys
        run: node bin/site-monitoring.mjs journeys --token ${{ secrets.MONITOR_TOKEN }} > journey-output.json
      - name: Keep the output
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: journey-output
          path: journey-output.json
